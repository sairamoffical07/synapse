spring.application.name=backend-test
server.port=8081

# H2 In-Memory Database Configuration for Automated Testing
spring.datasource.url=jdbc:h2:mem:synapsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mock / Default ChromaDB and Gemini properties for tests
chromadb.host=http://localhost:8000
chromadb.collection=synapse_documents_test

gemini.api-key=test-api-key
gemini.model=gemini-1.5-flash
gemini.embedding-model=text-embedding-004

ai.chunk.min-size=800
ai.chunk.max-size=1000
