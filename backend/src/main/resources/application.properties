spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL for Railway / H2 fallback for zero-config local execution)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/synapsedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Return a normal 413 response instead of resetting the connection on oversized uploads
server.tomcat.max-swallow-size=-1

# ChromaDB Configuration
chromadb.host=${CHROMA_URL:http://localhost:8000}
chromadb.collection=${CHROMA_COLLECTION:synapse_documents}

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

# Document Text Chunking Configuration
ai.chunk.min-size=800
ai.chunk.max-size=1000

# CORS: exact origins (comma-separated, no wildcards) plus optional full-match regexes.
# The default regex admits only this project's Vercel preview hosts
# (<project>-<deployment id>-sairamoffical07.vercel.app for the synapse and synapse-mgph projects).
cors.allowed-origins=${ALLOWED_ORIGINS:https://synapse-academic.vercel.app,https://synapse-mgph.vercel.app,http://localhost:5173}
cors.allowed-origin-regex=${ALLOWED_ORIGIN_REGEX:https://synapse(-mgph)?-[a-z0-9]+-sairamoffical07\\.vercel\\.app}

# JWT signing secret (32+ characters). If unset, a random key is generated at startup.
jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Gemini retry budget for transient 429/5xx responses
gemini.max-retries=${GEMINI_MAX_RETRIES:2}
