spring.application.name=backend
server.port=8080

# Database Configuration (H2 File Store in PostgreSQL compatibility mode for instant execution)
spring.datasource.url=jdbc:h2:file:./data/synapsedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ChromaDB Configuration
chromadb.host=http://localhost:8000
chromadb.collection=synapse_documents

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash
gemini.embedding-model=text-embedding-004

# Document Text Chunking Configuration
ai.chunk.min-size=800
ai.chunk.max-size=1000