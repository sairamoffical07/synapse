spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL for Railway / H2 fallback for zero-config local execution)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/synapsedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ChromaDB Configuration
chromadb.host=${CHROMA_URL:http://localhost:8000}
chromadb.collection=${CHROMA_COLLECTION:synapse_documents}

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# Document Text Chunking Configuration
ai.chunk.min-size=800
ai.chunk.max-size=1000

# CORS Allowed Origins
cors.allowed-origins=${ALLOWED_ORIGINS:*}